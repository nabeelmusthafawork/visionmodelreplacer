[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screendump"
version = "0.1.0"
description = "Converts a screenshot into a structured text/ASCII UI representation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
screendump = "screendump.cli:main"

[tool.setuptools]
packages = ["screendump"]